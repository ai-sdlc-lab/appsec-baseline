name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r gate/requirements.txt -r gate/requirements-dev.txt
      - working-directory: gate
        run: ruff check --line-length 120 . && ruff format --line-length 120 --check . && python -m pytest -q
      - name: Schema is valid JSON Schema 2020-12
        run: python -c "import json,jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('schemas/findings.schema.json')))"
